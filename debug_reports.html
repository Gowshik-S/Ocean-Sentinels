<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #218838;
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            background: rgba(0,0,0,0.2);
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            border-left: 4px solid #28a745;
        }
        .error {
            border-left: 4px solid #dc3545;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Ocean Hazard Reports Debug Test</h1>
        
        <div>
            <h3>Authentication</h3>
            <button onclick="testLogin()">Test Login</button>
            <button onclick="testRegister()">Test Register</button>
            <button onclick="checkAuth()">Check Auth Status</button>
        </div>

        <div>
            <h3>Reports Testing</h3>
            <button onclick="testCreateReport()">Test Create Report</button>
            <button onclick="testGetMyReports()">Test Get My Reports</button>
            <button onclick="testGetIncidents()">Test Get All Incidents</button>
        </div>

        <div>
            <h3>Create Test Report</h3>
            <div class="form-group">
                <input type="text" id="hazard_type" placeholder="Hazard Type (e.g., high-waves)" value="high-waves">
            </div>
            <div class="form-group">
                <input type="text" id="location" placeholder="Location" value="Test Beach, Mumbai">
            </div>
            <div class="form-group">
                <textarea id="description" placeholder="Description">Test high waves reported for debugging</textarea>
            </div>
            <div class="form-group">
                <input type="text" id="urgency" placeholder="Urgency (low/medium/high/critical)" value="medium">
            </div>
            <button onclick="createCustomReport()">Create Custom Report</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script src="/scripts/api-client.js"></script>
    <script>
        const api = new OceanHazardAPI();
        
        function showResult(message, isSuccess = true) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>\n${message}`;
            resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
        }
        
        async function testLogin() {
            try {
                const result = await api.login('test@example.com', 'password123');
                showResult(`✅ Login Success:\n${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                showResult(`❌ Login Failed: ${error.message}`, false);
            }
        }
        
        async function testRegister() {
            const testUser = {
                name: `Debug User ${Date.now()}`,
                email: `debug${Date.now()}@example.com`,
                phone: "9876543210",
                state: "Debug State",
                district: "Debug District",
                password: "password123"
            };
            
            try {
                const result = await api.register(testUser);
                showResult(`✅ Registration Success:\n${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                showResult(`❌ Registration Failed: ${error.message}`, false);
            }
        }
        
        async function checkAuth() {
            try {
                const user = await api.getCurrentUser();
                showResult(`✅ Current User:\n${JSON.stringify(user, null, 2)}`);
            } catch (error) {
                const token = localStorage.getItem('oceanGuardToken');
                const storedUser = localStorage.getItem('oceanGuardUser');
                showResult(`❌ Auth Check Failed: ${error.message}\nStored Token: ${token}\nStored User: ${storedUser}`, false);
            }
        }
        
        async function testCreateReport() {
            try {
                const reportData = {
                    hazard_type: "high-waves",
                    location: "Test Beach, Mumbai",
                    latitude: 19.0760,
                    longitude: 72.8777,
                    description: "Test high waves for debugging",
                    urgency: "medium",
                    contact_info: "test@example.com"
                };
                
                const result = await api.createIncident(reportData);
                showResult(`✅ Report Created:\n${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                showResult(`❌ Create Report Failed: ${error.message}`, false);
            }
        }
        
        async function testGetMyReports() {
            try {
                const result = await api.getMyReports();
                showResult(`✅ My Reports Retrieved:\n${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                showResult(`❌ Get My Reports Failed: ${error.message}`, false);
            }
        }
        
        async function testGetIncidents() {
            try {
                const result = await api.getIncidents();
                showResult(`✅ Incidents Retrieved:\n${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                showResult(`❌ Get Incidents Failed: ${error.message}`, false);
            }
        }
        
        async function createCustomReport() {
            try {
                const reportData = {
                    hazard_type: document.getElementById('hazard_type').value,
                    location: document.getElementById('location').value,
                    latitude: 19.0760,
                    longitude: 72.8777,
                    description: document.getElementById('description').value,
                    urgency: document.getElementById('urgency').value,
                    contact_info: "debug@example.com"
                };
                
                const result = await api.createIncident(reportData);
                showResult(`✅ Custom Report Created:\n${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                showResult(`❌ Custom Report Failed: ${error.message}`, false);
            }
        }
    </script>
</body>
</html>
