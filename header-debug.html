<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .header-element { background: #f0f0f0; padding: 10px; margin: 5px 0; border-left: 4px solid #007bff; }
        .nav-element { background: #e8f4f8; padding: 10px; margin: 5px 0; border-left: 4px solid #28a745; }
        pre { background: #f8f8f8; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Ocean Hazard Header Debug Test</h1>
    
    <div class="debug-section">
        <h3>DOM Element Count Check</h3>
        <div id="element-counts"></div>
    </div>
    
    <div class="debug-section">
        <h3>Header Elements Found</h3>
        <div id="header-elements"></div>
    </div>
    
    <div class="debug-section">
        <h3>Navigation Elements Found</h3>
        <div id="nav-elements"></div>
    </div>
    
    <div class="debug-section">
        <h3>Manual Visual Check</h3>
        <p>Open the main index page in another tab and compare with this analysis:</p>
        <button onclick="window.open('pages/index.html', '_blank')" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px;">
            Open Index Page
        </button>
    </div>

    <script>
        function analyzeHeaders() {
            // Fetch and analyze the index.html content
            fetch('pages/index.html')
                .then(response => response.text())
                .then(html => {
                    // Parse HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Count various elements
                    const headerElements = doc.querySelectorAll('header');
                    const navElements = doc.querySelectorAll('nav');
                    const navMenus = doc.querySelectorAll('.nav-menu');
                    const mainHeaders = doc.querySelectorAll('.main-header');
                    const navbars = doc.querySelectorAll('.navbar');
                    
                    // Display counts
                    document.getElementById('element-counts').innerHTML = `
                        <div><strong>Header Tags:</strong> ${headerElements.length}</div>
                        <div><strong>Nav Tags:</strong> ${navElements.length}</div>
                        <div><strong>Elements with .nav-menu:</strong> ${navMenus.length}</div>
                        <div><strong>Elements with .main-header:</strong> ${mainHeaders.length}</div>
                        <div><strong>Elements with .navbar:</strong> ${navbars.length}</div>
                    `;
                    
                    // Display header elements
                    let headerHtml = '';
                    headerElements.forEach((header, index) => {
                        headerHtml += `
                            <div class="header-element">
                                <strong>Header ${index + 1}:</strong>
                                <pre>${header.outerHTML.substring(0, 200)}${header.outerHTML.length > 200 ? '...' : ''}</pre>
                            </div>
                        `;
                    });
                    document.getElementById('header-elements').innerHTML = headerHtml || '<p>No header elements found</p>';
                    
                    // Display nav elements
                    let navHtml = '';
                    navElements.forEach((nav, index) => {
                        navHtml += `
                            <div class="nav-element">
                                <strong>Nav ${index + 1}:</strong>
                                <pre>${nav.outerHTML.substring(0, 200)}${nav.outerHTML.length > 200 ? '...' : ''}</pre>
                            </div>
                        `;
                    });
                    document.getElementById('nav-elements').innerHTML = navHtml || '<p>No nav elements found</p>';
                    
                    // Check for potential duplicates
                    if (headerElements.length > 1) {
                        alert(`⚠️ Found ${headerElements.length} header elements! This might be the issue.`);
                    }
                    
                    if (navElements.length > 1) {
                        alert(`⚠️ Found ${navElements.length} nav elements! This might be the issue.`);
                    }
                })
                .catch(error => {
                    console.error('Error fetching index.html:', error);
                    document.getElementById('element-counts').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                });
        }
        
        // Run analysis when page loads
        document.addEventListener('DOMContentLoaded', analyzeHeaders);
    </script>
</body>
</html>
