# Project-wide Gradle settings.

# JVM memory settings - increased to prevent daemon heap space issues
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel execution for multi-module projects
org.gradle.parallel=true

# Disable configuration caching (conflicts with some plugins)
org.gradle.configuration-cache=false

# AndroidX settings
android.useAndroidX=true

# Enable non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Enable build cache
org.gradle.caching=true

# Mapbox Downloads Token (for downloading SDK from Maven)
# Get your SECRET token from https://account.mapbox.com/access-tokens/
# Create a token with "Downloads:Read" scope (starts with sk.)
