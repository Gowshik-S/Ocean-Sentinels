<!DOCTYPE html>
<html>
<head>
    <title>API Test Debug</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        .error { background: #ffeeee; color: red; }
        .success { background: #eeffee; color: green; }
    </style>
</head>
<body>
    <h1>Ocean Hazard API Debug Test</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="testRegistration()">Test Registration</button>
    <button onclick="clearResults()">Clear Results</button>
    <div id="results"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:9000/api';
        
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.textContent = new Date().toISOString() + ' - ' + message;
            document.getElementById('results').appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testAPI() {
            log('Testing API Base URL: ' + API_BASE);
            
            // Test root endpoint
            try {
                const response = await fetch('http://127.0.0.1:9000/');
                const data = await response.json();
                log('✅ Root endpoint works: ' + data.message);
            } catch (error) {
                log('❌ Root endpoint failed: ' + error.message, true);
            }
            
            // Test API docs
            try {
                const response = await fetch(API_BASE + '/docs');
                if (response.ok) {
                    log('✅ API docs accessible');
                } else {
                    log('❌ API docs failed: ' + response.status, true);
                }
            } catch (error) {
                log('❌ API docs request failed: ' + error.message, true);
            }
            
            // Test auth endpoint without credentials (should get 401)
            try {
                const response = await fetch(API_BASE + '/auth/me');
                if (response.status === 401) {
                    log('✅ Auth endpoint responds correctly (401 Unauthorized)');
                } else {
                    log('⚠️ Unexpected auth response: ' + response.status);
                }
            } catch (error) {
                log('❌ Auth endpoint failed: ' + error.message, true);
            }
        }
        
        async function testRegistration() {
            const testUser = {
                username: 'testuser' + Date.now(),
                email: 'test' + Date.now() + '@example.com',
                password: 'testpass123',
                first_name: 'Test',
                last_name: 'User',
                phone: '1234567890',
                location: 'test-location'
            };
            
            log('Testing registration with user: ' + testUser.email);
            
            try {
                const response = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testUser)
                });
                
                log('Registration response status: ' + response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    log('✅ Registration successful! User ID: ' + data.id);
                } else {
                    const errorData = await response.json().catch(() => ({ detail: 'Unknown error' }));
                    log('❌ Registration failed: ' + errorData.detail, true);
                }
                
            } catch (error) {
                log('❌ Registration request failed: ' + error.message, true);
                log('❌ Error details: ' + error.toString(), true);
            }
        }
        
        // Auto-run basic test on load
        window.addEventListener('load', () => {
            testAPI();
        });
    </script>
</body>
</html>
