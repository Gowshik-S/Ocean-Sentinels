name: iOS Compile Check

on:
  push:
    branches: [main]
    paths:
      - "IOS/**"
  pull_request:
    paths:
      - "IOS/**"
  workflow_dispatch:

jobs:
  build-ios:
    name: "Build — iOS Simulator (xcodebuild)"
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      # Resolve SPM dependencies up front so the build step is cleaner
      - name: Resolve Swift Package dependencies
        working-directory: IOS
        run: swift package resolve

      # xcodebuild auto-generates a scheme from Package.swift.
      # Build against iOS Simulator SDK to catch all iOS API usage,
      # type mismatches, missing members, wrong argument labels, etc.
      - name: xcodebuild (iOS Simulator SDK)
        working-directory: IOS
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme OceanSentinels \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            2>&1 | tee build.log | tail -80
          echo "✅ Build succeeded"
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: IOS/build.log
