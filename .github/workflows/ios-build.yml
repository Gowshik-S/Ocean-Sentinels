name: iOS Compile Check

on:
  push:
    branches: [main]
    paths:
      - "IOS/**"
  pull_request:
    paths:
      - "IOS/**"
  workflow_dispatch:

jobs:
  build-ios:
    name: "Build — iOS Simulator (Xcode)"
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      # Build against iOS Simulator SDK — catches all iOS API errors,
      # type mismatches, missing members, wrong argument labels, etc.
      - name: xcodebuild (iOS Simulator SDK)
        working-directory: IOS
        run: |
          set -o pipefail
          xcodebuild \
            -scheme OceanSentinels \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            build \
            2>&1 | tee build.log | grep -E "error:|warning:|Build succeeded|BUILD FAILED" | head -150
          if grep -q "BUILD FAILED" build.log; then
            echo "::error::Build failed — errors:"
            grep "error:" build.log | head -60
            exit 1
          fi
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: build-log
          path: build.log
