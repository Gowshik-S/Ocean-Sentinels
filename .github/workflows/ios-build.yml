name: iOS Compile Check

on:
  push:
    branches: [main]
    paths:
      - "IOS/**"
  pull_request:
    paths:
      - "IOS/**"
  workflow_dispatch:

jobs:
  build-ios:
    name: "Build — iOS (Swift Package)"
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      # Build as a Swift Package (library target) to catch
      # type errors, missing members, wrong argument labels, etc.
      # Uses Package.swift — no .xcodeproj required.
      - name: swift build (compile check)
        working-directory: IOS
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed — errors:"
            grep -E "error:" build.log | head -60
            exit 1
          fi
          echo "✅ Build succeeded"
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: IOS/build.log

