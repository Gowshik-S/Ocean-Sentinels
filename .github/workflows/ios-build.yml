name: iOS Compile Check

on:
  push:
    branches: [main]
    paths:
      - "IOS/**"
  pull_request:
    paths:
      - "IOS/**"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  swift-build:
    name: "Swift Build (macOS — syntax & type check)"
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package dependencies
        working-directory: IOS
        run: swift package resolve

      # ── Fast Pass: build against macOS SDK (no simulator needed) ────────────
      # Catches: syntax errors, type mismatches, missing members, wrong labels.
      # SwiftUI / SwiftData / CoreBluetooth / Combine are all available on macOS 14.
      - name: Swift build (macOS target — fast)
        working-directory: IOS
        run: swift build 2>&1

  xcodebuild-ios:
    name: "xcodebuild (iOS Simulator — full API check)"
    runs-on: macos-15
    needs: swift-build   # only run if the fast pass succeeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show available simulators
        run: xcrun simctl list devices available --json | python3 -c "
import json,sys; d=json.load(sys.stdin)
for runtime,devs in d['devices'].items():
    iphones=[x['name'] for x in devs if 'iPhone' in x['name']]
    if iphones: print(runtime, ':', iphones[0])
" 2>/dev/null || true

      # ── Thorough Pass: build against iOS Simulator SDK ──────────────────────
      # Catches iOS-only API differences and framework availability.
      - name: xcodebuild for iOS Simulator
        working-directory: IOS
        run: |
          set -o pipefail
          xcodebuild \
            -scheme OceanSentinels \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            build \
            2>&1 | tee build.log | grep -E "error:|warning:|Build succeeded|BUILD FAILED" | head -100
          # Surface the full log on failure
          if grep -q "BUILD FAILED" build.log; then
            echo "::error::Build failed — full error list:"
            grep "error:" build.log
            exit 1
          fi
