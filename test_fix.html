<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Registration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 500px; margin: 0 auto; }
        button { background: #007bff; color: white; padding: 15px 25px; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 Quick Registration Fix Test</h2>
        <button onclick="testRegistration()">Test Registration</button>
        <div id="result"></div>
    </div>

    <script src="scripts/api-client.js"></script>
    <script>
        async function testRegistration() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '⏳ Testing registration...';
            
            try {
                const api = new OceanHazardAPI();
                const timestamp = Date.now();
                
                const userData = {
                    username: `test_${timestamp}`,
                    email: `test_${timestamp}@example.com`,
                    password: 'testpass123',
                    first_name: 'Test',
                    last_name: 'User'
                };
                
                console.log('🌊 Testing registration with:', userData);
                const response = await api.register(userData);
                console.log('✅ Registration response:', response);
                
                // Test the fix: accessing response.id directly
                const userId = response.id;
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    ✅ <strong>Registration Fixed!</strong><br>
                    User ID: ${userId}<br>
                    Username: ${response.username}<br>
                    Email: ${response.email}<br>
                    Role: ${response.role}<br>
                    <br>🎉 No more "Cannot read properties of undefined" error!
                `;
                
            } catch (error) {
                console.error('❌ Registration failed:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ <strong>Registration Failed:</strong><br>${error.message}`;
            }
        }
    </script>
</body>
</html>
