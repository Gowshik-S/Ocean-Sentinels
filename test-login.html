<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Ocean Guard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #FF6600; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e55a00; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Test Login</h1>
    <p>Use credentials: <strong>user / user</strong> or <strong>admin / admin</strong></p>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" value="user" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" value="user" required>
        </div>
        
        <button type="submit">Login</button>
    </form>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <div style="margin-top: 30px;">
        <a href="test-register.html">Test Registration</a> |
        <a href="pages/my-reports.html">Go to My Reports (after login)</a>
    </div>

    <script src="scripts/api-client.js"></script>
    <script>
        // Update API base URL for our local server
        const api = new OceanHazardAPI('http://127.0.0.1:8002/api');
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            
            try {
                result.style.display = 'block';
                result.innerHTML = '<p>Logging in...</p>';
                
                // Use form data login since that's what our server expects
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('http://127.0.0.1:8002/api/auth/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Store token and user data
                    localStorage.setItem('oceanGuardToken', data.access_token);
                    localStorage.setItem('oceanGuardUser', JSON.stringify(data.user));
                    
                    result.innerHTML = `
                        <h3>Login Successful!</h3>
                        <p><strong>Token:</strong> ${data.access_token}</p>
                        <p><strong>User:</strong> ${data.user.full_name || data.user.first_name + ' ' + data.user.last_name}</p>
                        <p><strong>Role:</strong> ${data.user.role}</p>
                        <p>You can now visit the <a href="pages/my-reports.html">My Reports</a> page.</p>
                    `;
                } else {
                    const error = await response.json();
                    result.innerHTML = `<p style="color: red;">Login failed: ${error.detail}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
